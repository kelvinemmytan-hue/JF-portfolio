<!doctype html>
<!-- Template for assets/og-image.jpg (the preview shown when the link is shared).
     {{...}} values are filled from content/site.json and content/themes.json by: node scripts/screenshots.mjs --og -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: {{bg}}; color: #eef5f5; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; position: relative; overflow: hidden; }
  body::after { content: ""; position: absolute; left: -200px; bottom: -260px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, {{aurora2}}aa, transparent 65%); }
  body::before { content: ""; position: absolute; right: -180px; top: -180px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, {{aurora1}}cc, transparent 65%); }
  .mark { width: 72px; height: 72px; border-radius: 18px; border: 2px solid {{accent}}; box-shadow: 0 0 30px {{accent}}66; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; margin-bottom: 44px; }
  .mark span { color: {{accent}}; }
  h1 { font-size: 76px; line-height: 1.05; margin: 0; letter-spacing: -2px; }
  p { font-size: 34px; background: {{gradText}}; -webkit-background-clip: text; color: transparent; margin: 22px 0 0; font-weight: 600; }
  .tags { margin-top: 44px; font-size: 24px; color: #9bb2b4; }
</style>
</head>
<body>
  <div class="mark">{{initial}}<span>.</span></div>
  <h1>{{name}}</h1>
  <p>{{jobTitle}}</p>
  <div class="tags">{{tags}}</div>
</body>
</html>
